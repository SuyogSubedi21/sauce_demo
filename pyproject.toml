[project]
name = "playwrite-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.65.2",
    "pytest-playwright>=0.10.0",
]

[project.scripts]
playwrite-testing = "playwrite_testing:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "smoke: critical happy-path tests",
]